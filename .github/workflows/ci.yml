name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Deploys run only when started by hand from the Actions tab (see the deploy jobs below)
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # BACKEND TESTS
  # ===========================================
  test-backend:
    name: Backend - Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No lint step yet: ESLint is not installed or configured in this package (the step failed with
      # "eslint: not found" / "Missing script: lint"). The type check below still runs.
      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test -- --ci --coverage=false

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

  # ===========================================
  # BACKEND E2E TESTS (requires database)
  # ===========================================
  test-backend-e2e:
    name: Backend - E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.0
        # Same database, user and port the integration harness (test/tenant/harness.ts) connects to
        env:
          MYSQL_ROOT_PASSWORD: root_pass
          MYSQL_DATABASE: saas_test
          MYSQL_USER: saas_test
          MYSQL_PASSWORD: saas_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3307 -u saas_test -psaas_test --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      # No separate migration step: the harness wipes the database and the app runs every migration on start,
      # so each run also proves the migrations build the schema. It sets its own DB user, secrets and NODE_ENV.
      - name: Run integration tests (real MySQL)
        run: npm run test:tenant
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3307

  # ===========================================
  # FRONTEND TESTS
  # ===========================================
  test-frontend:
    name: Frontend - Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No lint step yet: ESLint is not installed or configured in this package (the step failed with
      # "eslint: not found" / "Missing script: lint"). The type check below still runs.
      - name: Type check
        run: npx tsc --noEmit

      # `vitest run` never watches; it does not take jest's --ci / --coverage flags
      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          API_URL: http://localhost:3000

  # ===========================================
  # DOCKER BUILD TEST (verify Dockerfiles work)
  # ===========================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: saas-crm-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          load: true
          tags: saas-crm-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test backend image runs
        run: |
          docker run --rm -d --name backend-test -p 3000:3000 \
            -e NODE_ENV=production \
            -e DB_HOST=invalid \
            -e JWT_SECRET=test \
            saas-crm-backend:test
          sleep 10
          # Should fail to connect to DB but process should be running
          docker logs backend-test
          docker stop backend-test

      - name: Test frontend image runs
        run: |
          docker run --rm -d --name frontend-test -p 3001:3001 \
            -e NODE_ENV=production \
            saas-crm-frontend:test
          sleep 10
          curl -f http://localhost:3001 || true
          docker logs frontend-test
          docker stop frontend-test

  # ===========================================
  # DEPLOY PREVIEW (on PRs)
  # ===========================================
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, docker-build]
    # Switched off: Railway is not set up yet (RAILWAY_TOKEN secret, preview environments). Remove the `false`
    # once it is.
    if: false && github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Railway Preview
        uses: railwayapp/railway-deploy@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: backend
          environment: preview-${{ github.event.pull_request.number }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ===========================================
  # DEPLOY PRODUCTION (on main branch)
  # ===========================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, docker-build]
    # Production changes only when someone starts this workflow by hand on main (Actions → CI → Run workflow),
    # never on every push: it also runs migrations on the production database. Before the first run: add the
    # RAILWAY_TOKEN secret, set API_URL on the Railway frontend service, and check railway.json's health check
    # path (/health is not served by the backend). The `railway` CLI used below is not installed by this job.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Backend to Railway
        uses: railwayapp/railway-deploy@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Frontend to Railway
        uses: railwayapp/railway-deploy@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Run migrations on production
        run: |
          railway run --service backend npm run migration:run
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify deployment
        run: |
          echo "✅ Deployment complete!"
          echo "Backend: https://${{ secrets.RAILWAY_BACKEND_DOMAIN }}"
          echo "Frontend: https://${{ secrets.RAILWAY_FRONTEND_DOMAIN }}"