name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # BACKEND TESTS
  # ===========================================
  test-backend:
    name: Backend - Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test -- --ci --coverage=false

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

  # ===========================================
  # BACKEND E2E TESTS (requires database)
  # ===========================================
  test-backend-e2e:
    name: Backend - E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_pass
          MYSQL_DATABASE: saas_crm_test
          MYSQL_USER: saas_user
          MYSQL_PASSWORD: saas_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u saas_user -psaas_pass --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      - name: Run migrations
        run: npm run migration:run
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: saas_user
          DB_PASSWORD: saas_pass
          DB_DATABASE: saas_crm_test
          NODE_ENV: test

      - name: Run E2E tests
        run: npm run test:tenant
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: saas_user
          DB_PASSWORD: saas_pass
          DB_DATABASE: saas_crm_test
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-only
          THROTTLE_DISABLED: 'true'

  # ===========================================
  # FRONTEND TESTS
  # ===========================================
  test-frontend:
    name: Frontend - Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test -- --ci --coverage=false

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:3000/api

  # ===========================================
  # DOCKER BUILD TEST (verify Dockerfiles work)
  # ===========================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: saas-crm-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          load: true
          tags: saas-crm-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test backend image runs
        run: |
          docker run --rm -d --name backend-test -p 3000:3000 \
            -e NODE_ENV=production \
            -e DB_HOST=invalid \
            -e JWT_SECRET=test \
            saas-crm-backend:test
          sleep 10
          # Should fail to connect to DB but process should be running
          docker logs backend-test
          docker stop backend-test

      - name: Test frontend image runs
        run: |
          docker run --rm -d --name frontend-test -p 3001:3001 \
            -e NODE_ENV=production \
            saas-crm-frontend:test
          sleep 10
          curl -f http://localhost:3001 || true
          docker logs frontend-test
          docker stop frontend-test

  # ===========================================
  # DEPLOY PREVIEW (on PRs)
  # ===========================================
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, docker-build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Railway Preview
        uses: railwayapp/railway-deploy@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: backend
          environment: preview-${{ github.event.pull_request.number }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ===========================================
  # DEPLOY PRODUCTION (on main branch)
  # ===========================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Backend to Railway
        uses: railwayapp/railway-deploy@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Frontend to Railway
        uses: railwayapp/railway-deploy@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Run migrations on production
        run: |
          railway run --service backend npm run migration:run
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify deployment
        run: |
          echo "✅ Deployment complete!"
          echo "Backend: https://${{ secrets.RAILWAY_BACKEND_DOMAIN }}"
          echo "Frontend: https://${{ secrets.RAILWAY_FRONTEND_DOMAIN }}"