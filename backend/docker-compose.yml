services:
  mysql:
    image: mysql:8.0
    container_name: saas-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: saas_crm
      MYSQL_USER: saas_user
      MYSQL_PASSWORD: saas_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - saas-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: saas-backend
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge

volumes:
  mysql_data: